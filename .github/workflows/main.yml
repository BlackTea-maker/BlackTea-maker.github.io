name: Build and Deploy Flutter Web

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Собираем проект внутри папки flutter_application_1
      - name: Build Web
        working-directory: ./flutter_application_1
        run: |
          flutter create . --platforms=web
          flutter pub get
          flutter build web --base-href "/"

      # 4. Копируем готовую сборку в корень репозитория
      - name: Copy build to root
        run: |
          cp -rf flutter_application_1/build/web/* .

      # 5. Коммитим и пушим все файлы в master
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Auto-deploy: update web build [skip ci]" || echo "No changes to commit"
          git push
