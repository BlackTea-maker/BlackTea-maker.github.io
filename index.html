<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пользователи</title>
  <style>
    body { font: 16px sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input, button { font: inherit; padding: 8px; }
    input { flex: 1; }
    li { margin: 8px 0; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Пользователи</h1>

  <form id="user-form">
    <input id="name" name="name" type="text" placeholder="Имя" required>
    <input id="email" name="email" type="text" placeholder="Email" required>
    <input id="password" name="pswdInput" type="text" placeholder="Пароль" required>
    <button type="submit">Добавить</button>
  </form>

  <p id="status" role="status"></p>
  <ul id="users"></ul>


  <!-- <h1>Регистрация</h1>
  <form id="register-form">
    <input id="name" name="name" type="text" placeholder="Имя" required>
    <input id="email" name="email" type="text" placeholder="Email" required>
    <input id="password" name="pswdInput" type="text" placeholder="Пароль" required>
    <button type="submit">Зарегистрироваться</button>
  </form>

  <h1>Вход</h1>
  <form id="login-form">
    <input id="name" name="name" type="text" placeholder="Имя" required>
    <input id="email" name="email" type="text" placeholder="Email" required>
    <input id="password" name="pswdInput" type="text" placeholder="Пароль" required>
    <button type="submit">Зарегистрироваться</button>
  </form> -->
  <!-- SDK подключается через CDN; import и module не используются -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://qufrlcqlsctkdsmkhsqi.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_j3_edwcCyvmGaAZR0dV6Nw_M_v5gkA6';

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('user-form');
    const nameInput = document.getElementById('name');
    const usersList = document.getElementById('users');
    const emailInput = document.getElementById('email')
    const passwordInput = document.getElementById('password')
    const status = document.getElementById('status');

    async function loadUsers() {
      status.textContent = 'Загружаю…';

      const { data, error } = await client
        .from('users')
        .select('id, name, email')
        .order('id', { ascending: false })
        .limit(100);

      if (error) {
        status.textContent = 'Ошибка загрузки: ' + error.message;
        return;
      }

      usersList.replaceChildren();

      for (const user of data) {
        const item = document.createElement('li');
        item.textContent = `ID: ${user.id} — ${user.name ?? ''}`;
        usersList.appendChild(item);
      }

      status.textContent = `Загружено записей: ${data.length}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!name) return;

      status.textContent = 'Добавляю…';

      const { error } = await client
        .from('users')
        .insert({ name, email, password });

      if (error) {
        status.textContent = 'Ошибка добавления: ' + error.message;
        return;
      }

      nameInput.value = '';
      status.textContent = 'Пользователь добавлен.';
      await loadUsers();
    });

    loadUsers();
  </script>
</body>
</html>
